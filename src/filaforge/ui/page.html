<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilaForge</title>
<style>
:root {
  --bg: var(--orca-bg, #ffffff);
  --fg: var(--orca-fg, #1f2429);
  --muted: var(--orca-muted, #6b7580);
  --border: var(--orca-border, #d9dee3);
  --accent: var(--orca-accent, #009688);
  --accent-fg: var(--orca-accent-fg, #ffffff);
  --ui: var(--orca-font, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --panel: color-mix(in srgb, var(--fg) 4%, var(--bg));
  --soft: color-mix(in srgb, var(--fg) 8%, var(--bg));
  --tested: #2e7d32; --declared: #1565c0; --preset: #6a4fb3; --estimated: #b26a00; --baseline: #78828c;
  --bad: #c62828;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: var(--orca-bg, #2b2d30); --fg: var(--orca-fg, #e4e6e8); --muted: var(--orca-muted, #9aa0a6);
          --border: var(--orca-border, #3d4043);
          --tested: #66bb6a; --declared: #64b5f6; --preset: #b39ddb; --estimated: #ffb74d; --baseline: #9aa0a6; --bad: #ef5350; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--ui); display: flex; flex-direction: column; }
h1, h2, h3 { color: inherit; margin: 0; }
h2 { font-size: 13px; font-weight: 650; letter-spacing: .01em; }
a { color: var(--accent); }
button { font: inherit; padding: 5px 12px; cursor: pointer; border-radius: 6px; background: var(--accent);
         color: var(--accent-fg); border: 1px solid var(--accent); white-space: nowrap; }
button.secondary { background: transparent; color: var(--fg); border-color: var(--border); }
button.link { background: none; border: 0; color: var(--accent); padding: 0; }
button:disabled { opacity: .5; cursor: default; }
input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
                border-radius: 6px; padding: 5px 8px; min-width: 0; }
input[type=checkbox] { accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.muted { color: var(--muted); }
.small { font-size: 11.5px; }
.mono { font-family: var(--mono); font-size: 11.5px; }
[hidden] { display: none !important; }

header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
button.hb { display: inline-flex; align-items: center; gap: 7px; padding-left: 11px; }
button.hb .ico { width: 17px; height: 17px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
                 transition: transform .15s ease; }
button.hb:hover .ico { transform: scale(1.12); }
button.hb .count { margin-left: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.brand img { width: 32px; height: 32px; margin: -6px 0; }
.wordmark { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.wordmark b { font-weight: 800; background: linear-gradient(180deg, #f5841f, #c9331c); -webkit-background-clip: text;
              background-clip: text; color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--soft);
        font-size: 12px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }

main { flex: 1; display: grid; grid-template-columns: minmax(280px, 340px) 1fr; min-height: 0; }
aside { border-right: 1px solid var(--border); overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }
section.results { overflow: auto; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 18px; }

.tabs { display: flex; gap: 2px; background: var(--soft); padding: 2px; border-radius: 8px; }
.tabs button { flex: 1; background: transparent; border: 0; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.tabs button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11.5px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.row > button, .row > .fit { flex: none; }

.spools { border: 1px solid var(--border); border-radius: 8px; max-height: 260px; overflow: auto; }
.spool { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.spool:last-child { border-bottom: 0; }
.spool:hover { background: var(--soft); }
.spool.on { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
.swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent); flex: none; }
.spool .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--soft); color: var(--muted); }

.sheets { display: flex; flex-direction: column; gap: 4px; }
.sheet { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.sheet span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sources { display: flex; flex-direction: column; gap: 6px; }
.source { display: grid; grid-template-columns: 18px 1fr; gap: 2px 6px; font-size: 12px; }
.source .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--border); }
.source.ok .dot { background: var(--tested); }
.source.empty .dot { background: var(--estimated); }
.source.fail .dot { background: var(--bad); }
.source.run .dot { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
.source .msg { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }

.empty-state { margin: auto; text-align: center; color: var(--muted); max-width: 440px; padding: 40px 0; }
.empty-state .splash { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto 14px; border-radius: 12px;
                      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }

.card { border: 1px solid var(--border); border-radius: 10px; }
.card { overflow: hidden; flex-shrink: 0; }   /* overflow: hidden alone lets the results column squeeze cards */
.card > .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
                background: color-mix(in srgb, var(--accent) 9%, var(--bg)); box-shadow: inset 3px 0 0 var(--accent); }
.card > .head h2, .card > .head .title { color: color-mix(in srgb, var(--accent) 35%, var(--fg)); }
.card > .body { padding: 12px 14px; }
.title { font-size: 16px; font-weight: 700; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.val input { width: 86px; text-align: right; font-family: var(--mono); }
td.val input.wide { width: 220px; text-align: left; }
tr.off td:not(:first-child) { opacity: .5; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
         color: var(--k); background: color-mix(in srgb, var(--k) 14%, transparent); }
.k-tested { --k: var(--tested); } .k-declared { --k: var(--declared); } .k-preset { --k: var(--preset); }
.k-estimated { --k: var(--estimated); } .k-baseline { --k: var(--baseline); }
.conf { display: inline-flex; gap: 2px; vertical-align: middle; }
.conf i { width: 5px; height: 11px; border-radius: 2px; background: var(--border); }
.conf.c1 i:nth-child(-n+1), .conf.c2 i:nth-child(-n+2), .conf.c3 i:nth-child(-n+3) { background: var(--accent); }
.why { color: var(--muted); font-size: 11.5px; }
.calib { margin-top: 14px; padding: 0 12px 12px; border: 1px solid var(--border); border-radius: 10px; display: grid; gap: 8px; overflow: hidden; }
.calib > .calib-head { margin: 0 -12px; padding: 8px 12px; background: var(--soft); border-bottom: 1px solid var(--border); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grid4 input { width: 100%; box-sizing: border-box; min-width: 0; }
ul.ow { list-style: none; padding-left: 2px; }
.grid4 label { font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 3px; }
.note.warn { color: var(--estimated); }
.plan ul { margin: 4px 0 0; padding-left: 18px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.flash { outline: 2px solid var(--accent); outline-offset: 1px; }
details.alts summary { cursor: pointer; color: var(--accent); font-size: 11.5px; list-style: none; }
details.alts summary::-webkit-details-marker { display: none; }
.alt { font-size: 11.5px; display: flex; gap: 6px; padding: 1px 0; }
.alt .v { font-family: var(--mono); min-width: 64px; }
.alt.differ .v { color: var(--bad); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.note { font-size: 12px; color: var(--muted); }
.plan { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel); font-size: 12px; }
.plan ul { margin: 4px 0 0; padding-left: 18px; }

#toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px; border-radius: 8px;
         background: var(--fg); color: var(--bg); box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 12.5px; z-index: 9; }
#toast.err { background: var(--bad); color: #fff; }

dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--fg); padding: 0; width: min(520px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog .head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 650; }
dialog .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
dialog .foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.saved-list { max-height: 50vh; overflow: auto; }
#dlg-habits { width: min(1040px, 96vw); }
.habits { overflow: auto; max-height: 62vh; }
.habits th { white-space: normal; vertical-align: bottom; font-size: 11px; padding: 4px 5px; text-align: center; }
.habits th.grp { text-align: center; border-bottom: 0; color: var(--fg); }
.habits td { padding: 3px 5px; text-align: center; }
.habits td:first-child, .habits th:first-child { text-align: left; white-space: nowrap; }
.habits input[type=number] { width: 62px; text-align: right; font-family: var(--mono); padding: 3px 5px; }
.habits input.changed { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
.habits .sep { border-left: 1px solid var(--border); }
.warns { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.warns:empty { display: none; }
.warn-box { padding: 8px 10px; border-radius: 8px; font-size: 12px; border: 1px solid color-mix(in srgb, var(--estimated) 45%, transparent);
            background: color-mix(in srgb, var(--estimated) 10%, var(--bg)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.warn-box span { flex: 1; min-width: 220px; }
.saved-item { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.saved-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 999px; font-size: 11px; font-weight: 700;
         background: var(--estimated); color: #fff; line-height: 18px; text-align: center; }
.count.error { background: var(--bad); }
#dlg-review, #dlg-history, #dlg-preflight { width: min(860px, 94vw); }
.pf-head { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; margin: 8px 0 10px; color: var(--muted); }
.pf-head b { color: var(--fg, inherit); font-weight: 650; }
.cause.lv-stop { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.cause.lv-warn { border-color: var(--estimated); box-shadow: inset 3px 0 0 var(--estimated); }
.pf-ok { padding: 14px; border: 1px dashed var(--border); border-radius: 9px; font-size: 12.5px; text-align: center; }
.pf-flow { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 6px; }
.pf-flow th, .pf-flow td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--border); }
.pf-flow th:first-child, .pf-flow td:first-child { text-align: left; }
.pf-flow td.over { color: var(--bad); font-weight: 650; }
.issues { max-height: 62vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.issue { border: 1px solid var(--border); border-left: 4px solid var(--estimated); border-radius: 8px; padding: 8px 10px; font-size: 12px;
         display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
.issue.error { border-left-color: var(--bad); } .issue.info { border-left-color: var(--baseline); }
.issue .who { font-weight: 650; overflow-wrap: anywhere; }
.issue .what { grid-column: 1; color: var(--fg); }
.issue .fixes { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.issue table { width: auto; margin-top: 4px; }
.issue td { padding: 1px 10px 1px 0; border: 0; font-size: 11.5px; }
.issue td.n { font-family: var(--mono); text-align: right; }
.hist-group { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.hist-group > .who { font-weight: 650; display: flex; gap: 8px; align-items: center; }
.hist-row { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 3px 0; flex-wrap: wrap; }
.hist-row .when { flex: 1; color: var(--muted); }
.hist-diff { width: 100%; font-size: 11.5px; }
.hist-diff td { padding: 1px 8px 1px 0; border: 0; } .hist-diff td.mono { font-family: var(--mono); }
#dlg-defects { width: min(1060px, 96vw); }
#dlg-defects .body { max-height: 74vh; overflow: auto; }
.df-top { display: grid; grid-template-columns: minmax(220px, 340px); gap: 8px; align-items: center; }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chips button { display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: center; text-align: left; padding: 9px 11px;
                background: transparent; color: var(--fg); border: 1px solid var(--border); border-radius: 10px; font-weight: 600; }
.chips button:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.chips button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: inset 0 0 0 1px var(--accent); }
.chips .ico { grid-row: 1 / span 2; width: 24px; height: 24px; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chips small { grid-column: 2; font-weight: 400; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.chips button { min-width: 0; } .chips span, .chips small { min-width: 0; overflow-wrap: anywhere; white-space: normal; } .chips span { line-height: 1.25; }
@media (max-width: 1000px) { .chips { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.df-hist { display: flex; flex-direction: column; gap: 6px; }
.df-hist .item { border: 1px solid var(--border); border-radius: 9px; padding: 7px 11px; font-size: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.df-hist .item .when { color: var(--muted); font-size: 11.5px; }
.tag.good { background: color-mix(in srgb, var(--tested) 18%, transparent); }
.tag.bad { background: color-mix(in srgb, var(--bad, #c62828) 16%, transparent); }
.df-empty { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); font-size: 12.5px; }
.kind { font-size: 10.5px; font-weight: 650; padding: 1px 7px; border-radius: 999px; letter-spacing: .02em; }
.kind.change { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.kind.advice { background: color-mix(in srgb, var(--estimated) 18%, transparent); color: var(--estimated); }
.kind.calibration { background: color-mix(in srgb, var(--baseline) 22%, transparent); color: var(--fg); }
.kind.redirect { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--fg); }
.df-q { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.df-q .q { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--fg); padding: 4px 10px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: color-mix(in srgb, var(--accent) 18%, var(--bg)); color: var(--fg); font-weight: 600; }
.df-rows { display: grid; grid-template-columns: 170px 120px 120px auto; gap: 6px 8px; align-items: center; font-size: 12px; }
.df-rows input { width: 100%; text-align: right; font-family: var(--mono); }
.df-plan { display: flex; flex-direction: column; gap: 8px; }
.cause { border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; font-size: 12px; }
.cause.best { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.cause.tried { opacity: .62; }
.cause .name { font-weight: 650; font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cause .why { grid-column: 1; color: var(--fg); font-size: 12px; }
.cause .go { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 6px; }
.cause table { width: auto; margin-top: 4px; }
.cause td { padding: 1px 10px 1px 0; border: 0; font-size: 11.5px; }
.cause td.n { font-family: var(--mono); text-align: right; }
.pend { border: 1px solid color-mix(in srgb, var(--estimated) 50%, transparent); background: color-mix(in srgb, var(--estimated) 9%, var(--bg));
        border-radius: 9px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.pend span { flex: 1; min-width: 240px; }
.sec { font-size: 11.5px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--border); } }
.row2 { display: flex; gap: 10px; align-items: flex-end; }
.row2 select { width: 100%; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="{{img:emblem.png}}" alt="" width="32" height="32">
    <span class="wordmark">Fila<b>Forge</b></span>
  </div>
  <span class="chip" id="printer-chip" title=""></span>
  <span class="spacer"></span>
  <button class="secondary hb" id="btn-preflight"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span data-t="pf"></span><span class="count" id="pf-count" hidden></span></button>
  <button class="secondary hb" id="btn-defects"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 10a5 5 0 0 1-6.6 4.7L7.5 21.6a2.1 2.1 0 0 1-3-3l6.9-6.9A5 5 0 0 1 16.1 5z"/><path d="m14.7 6.3 2.3-2.3"/></svg><span data-t="df"></span><span class="count" id="df-count" hidden></span></button>
  <button class="secondary hb" id="btn-review"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="m9 13.5 2 2 4-4.5"/></svg><span data-t="review"></span><span class="count" id="review-count" hidden></span></button>
  <button class="secondary hb" id="btn-saved"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1z"/></svg><span data-t="saved"></span></button>
  <button class="secondary hb" id="btn-habits"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-t="habits"></span></button>
  <button class="secondary hb" id="btn-settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.5 2.4 2.8-.4.9 2.7 2.6 1.2-.8 2.7 1.7 2.3-2.2 1.7.1 2.8-2.8.5-1.4 2.5-2.4-1.4-2.4 1.4-1.4-2.5-2.8-.5.1-2.8-2.2-1.7 1.7-2.3-.8-2.7 2.6-1.2.9-2.7 2.8.4z"/></svg><span data-t="settings"></span></button>
</header>
<main>
  <aside>
    <div class="tabs" role="tablist">
      <button class="on" data-pick="spoolman" data-t="from_spoolman"></button>
      <button data-pick="orca" data-t="from_orca"></button>
      <button data-pick="manual" data-t="manual"></button>
    </div>
    <div id="pick-spoolman" class="field">
      <div class="row"><input id="spool-filter" type="search" data-tp="filter_spools"><button class="secondary fit" id="btn-reload-spools" data-t="reload" title=""></button></div>
      <div class="spools" id="spools"></div>
      <div class="note" id="spool-note"></div>
    </div>
    <div id="pick-orca" class="field" hidden>
      <div class="row"><input id="orca-filter" type="search" data-tp="filter_orca"><button class="secondary fit" id="btn-reload-orca" data-t="reload" title=""></button></div>
      <div class="spools" id="orca-list"></div>
      <div class="note" data-t="orca_note"></div>
    </div>
    <div id="pick-manual" class="field" hidden>
      <div class="field"><label data-t="brand"></label><input id="f-brand" data-tp="brand_eg" list="brands"></div>
      <div class="row">
        <div class="field"><label data-t="material"></label>
          <select id="f-material"></select></div>
        <div class="field"><label data-t="product"></label><input id="f-product" data-tp="product_eg" list="products"></div>
      </div>
      <datalist id="brands"></datalist><datalist id="products"></datalist>
      <div class="note small" id="products-note"></div>
    </div>
    <div class="field">
      <label data-t="sheet"></label>
      <div class="row"><input id="sheet-url" data-tp="sheet_eg"><button class="secondary fit" id="btn-add-sheet" data-t="add"></button></div>
      <div class="row"><label class="secondary fit small muted" for="sheet-file" style="cursor:pointer" data-t="or_pdf"></label><input type="file" id="sheet-file" accept="application/pdf,.pdf" hidden></div>
      <div class="sheets" id="sheets"></div>
    </div>
    <button id="btn-research" data-t="research"></button>
    <div class="sources" id="sources"></div>
    <div class="note small" id="licences"></div>
  </aside>

  <section class="results" id="results">
    <div class="empty-state" id="empty">
      <img class="splash" src="{{img:splash.webp}}" alt="FilaForge" width="420" height="237">
      <div data-t="empty"></div>
    </div>

    <div class="card" id="card-result" hidden>
      <div class="head">
        <span class="swatch" id="r-swatch"></span>
        <div><div class="title" id="r-title"></div><div class="small muted" id="r-base"></div></div>
        <span class="spacer"></span>
        <div class="small muted" id="r-legend"></div>
      </div>
      <div class="body">
        <div class="warns" id="r-warn"></div>
        <table>
          <thead><tr><th style="width:28px"></th><th data-t="setting"></th><th data-t="value"></th><th data-t="origin"></th><th data-t="sources"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <button class="link small" id="btn-same" style="margin-top:8px"></button>
      </div>
      <div class="body" style="border-top:1px solid var(--border)">
        <div class="row2">
          <div class="field" style="flex:2"><label data-t="preset_name"></label><input id="preset-name"></div>
          <div class="field" style="flex:1"><label data-t="cooling"></label>
            <select id="cooling"><option value="standard" data-t="cool_standard"></option><option value="detail" data-t="cool_detail"></option><option value="strength" data-t="cool_strength"></option></select>
          </div>
        </div>
        <div class="note" id="cooling-note" style="margin-top:4px"></div>
        <div class="actions" style="margin-top:10px">
          <button id="btn-make-preset" data-t="make_preset"></button>
          <button class="secondary" id="btn-spoolman-plan" data-t="to_spoolman"></button>
          <span class="note" id="act-note"></span>
        </div>
        <div class="plan" id="spoolman-plan" hidden></div>
      </div>
    </div>

    <div class="card" id="card-measured" hidden>
      <div class="head"><h2 data-t="measured_title"></h2><span class="spacer"></span>
        <select id="m-nozzle-sel" class="fit" title=""></select>
        <select id="m-section"></select></div>
      <div class="body">
        <div class="note" data-t="measured_note" style="margin-bottom:10px"></div>
        <div class="note warn" id="m-nozzle" hidden style="margin-bottom:10px"></div>
        <div class="grid2" id="m-fields"></div>
        <div class="calib">
          <div class="row calib-head" style="gap:10px"><b data-t="calib_title"></b>
            <select id="c-test" class="fit"></select></div>
          <div class="note" id="c-how"></div>
          <div class="grid4" id="c-inputs"></div>
          <div class="row" style="justify-content:flex-start;gap:12px"><span id="c-result" class="mono"></span>
            <button class="secondary fit" id="btn-c-use" data-t="calib_use"></button></div>
        </div>
        <div class="actions" style="margin-top:12px"><button id="btn-save-measured" data-t="save_measured"></button>
          <span class="note" id="m-note"></span></div>
      </div>
    </div>

    <div class="card" id="card-process" hidden>
      <div class="head"><h2 data-t="process_title"></h2></div>
      <div class="body">
        <div class="note" data-t="process_note" style="margin-bottom:10px"></div>
        <div class="row"><select id="p-base"></select>
          <select id="p-variant" class="fit"><option value="standard" data-t="v_standard"></option><option value="small" data-t="v_small"></option><option value="plate" data-t="v_plate"></option></select>
          <button class="secondary fit" id="btn-process-plan" data-t="calculate"></button></div>
        <div id="p-plan" hidden style="margin-top:12px">
          <div class="note" id="p-variant-note" style="margin-bottom:8px"></div>
          <div class="warns" id="p-warn"></div>
          <table><thead><tr><th data-t="setting"></th><th data-t="now"></th><th data-t="new"></th><th data-t="why"></th></tr></thead><tbody id="p-rows"></tbody></table>
          <div class="field" style="margin-top:10px"><label data-t="process_name"></label><input id="p-name"></div>
          <div class="actions" style="margin-top:10px"><button id="btn-process-save" data-t="save_process"></button><span class="note" id="p-note"></span></div>
        </div>
      </div>
    </div>
  </section>
</main>

<dialog id="dlg-settings">
  <div class="head" data-t="settings"></div>
  <div class="body">
    <div class="field"><label data-t="spoolman_url"></label><input id="s-spoolman" placeholder="http://192.168.1.2:7912"></div>
    <div class="field"><label data-t="language"></label>
      <select id="s-language"><option value="auto">Auto</option><option value="pl">Polski</option><option value="en">English</option></select></div>
    <label class="row" style="justify-content:flex-start;gap:8px"><input type="checkbox" id="s-online" style="flex:none"><span data-t="online"></span></label>
  </div>
  <div class="foot"><button class="secondary" data-close data-t="cancel"></button><button id="btn-settings-save" data-t="save"></button></div>
</dialog>

<dialog id="dlg-habits">
  <div class="head" data-t="habits_title"></div>
  <div class="body">
    <div class="note" data-t="habits_note"></div>
    <div class="habits"><table id="habits-table"></table></div>
    <div class="habits" style="margin-top:10px"><table id="habits-table2"></table></div>
  </div>
  <div class="foot"><button class="secondary" id="btn-habits-reset" data-t="habits_reset" style="margin-right:auto"></button>
    <button class="secondary" data-close data-t="cancel"></button><button id="btn-habits-save" data-t="save"></button></div>
</dialog>

<dialog id="dlg-saved">
  <div class="head" data-t="saved_title"></div>
  <div class="body"><div class="note" data-t="saved_note"></div><div class="saved-list" id="saved-list"></div></div>
  <div class="foot"><button class="secondary" id="btn-history" data-t="history" style="margin-right:auto"></button><button class="secondary" data-close data-t="close"></button></div>
</dialog>

<dialog id="dlg-preflight">
  <div class="head" data-t="pf_title"></div>
  <div class="body">
    <div class="note" data-t="pf_note"></div>
    <div id="pf-head" class="pf-head"></div>
    <div class="df-plan" id="pf-list"></div>
    <details id="pf-flow-box" hidden><summary data-t="pf_flow"></summary><table class="pf-flow" id="pf-flow"></table></details>
  </div>
  <div class="foot"><button class="secondary" id="btn-pf-again" data-t="pf_again" style="margin-right:auto"></button><button class="secondary" data-close data-t="close"></button></div>
</dialog>

<dialog id="dlg-review">
  <div class="head" data-t="review_title"></div>
  <div class="body"><div class="note" data-t="review_note"></div><div class="issues" id="issues"></div></div>
  <div class="foot"><button class="secondary" id="btn-review-again" data-t="review_again" style="margin-right:auto"></button><button class="secondary" data-close data-t="close"></button></div>
</dialog>

<dialog id="dlg-defects">
  <div class="head" data-t="df_title"></div>
  <div class="body">
    <div id="df-pending" class="df-plan"></div>
    <div class="note" data-t="df_note"></div>
    <div class="df-top"><select id="df-slot"></select></div>
    <div class="chips" id="df-list"></div>
    <div class="df-q" id="df-q"></div>
    <div id="df-inputs"></div>
    <div class="df-plan" id="df-plan"></div>
    <div id="df-history" hidden>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><b data-t="dfh_title"></b>
        <label class="inline small"><input type="checkbox" id="dfh-all"> <span data-t="dfh_all"></span></label></div>
      <div class="df-hist" id="dfh-list"></div>
    </div>
  </div>
  <div class="foot"><span class="note" data-t="df_rule" style="margin-right:auto"></span>
    <button class="secondary" id="btn-df-history" data-t="dfh_open"></button><button class="secondary" data-close data-t="close"></button></div>
</dialog>

<dialog id="dlg-history">
  <div class="head" data-t="history_title"></div>
  <div class="body"><div class="note" data-t="history_note"></div><div class="issues" id="history-list"></div></div>
  <div class="foot"><button class="secondary" data-close data-t="close"></button></div>
</dialog>

<div id="toast" hidden></div>

      : c.kind === 'calibration' ? `<button class="secondary" data-apply="${i}">${esc(t('df_test'))}</button>${TEST_CALIB[c.test] ? `<button class="link small" data-calib="${esc(c.test)}">${esc(t('df_enter'))}</button>` : ''}`
      : c.kind === 'redirect' ? `<button class="secondary" data-redirect="${esc(c.vars.defect)}">${esc(t('df_go'))}: ${esc(t('dn_' + c.vars.defect))}</button>` : '';
    const rows = (c.changes || []).length ? `<table>${c.changes.map(ch => `<tr><td>${esc(dfLabel(ch.key))} <span class="tag">${esc(t('tg_' + ch.target))}</span></td>
        <td class="n">${esc(dfValue(ch.before))}</td><td>→</td><td class="n"><b>${esc(dfValue(ch.after))}</b></td></tr>`).join('')}</table>` : '';
    const good = (c.elsewhere || []).filter(e => e.outcome === 'fixed' || e.outcome === 'better').map(e => e.label);
    const bad = (c.elsewhere || []).filter(e => e.outcome === 'same' || e.outcome === 'worse').map(e => e.label);
    const els = !tried && good.length ? ` <span class="tag good" title="${esc(good.join(', '))}">${esc(t('el_good', {names: good.join(', ')}))}</span>`
      : !tried && bad.length ? ` <span class="tag bad" title="${esc(bad.join(', '))}">${esc(t('el_bad', {names: bad.join(', ')}))}</span>` : '';
    const name = c.kind === 'need' ? '' : `<div class="name">${esc(t('cn_' + c.cause))} <span class="kind ${c.kind}">${esc(t('dk_kind_' + c.kind))}</span>${tried ? ` <span class="tag">${esc(t('tr_' + tried))}</span>` : ''}${els}</div>`;
    const how = c.kind === 'calibration' && c.test ? `<div class="note" style="margin-top:4px">${esc(t('tst_' + c.test))}</div>` : '';
    return `<div class="cause${best ? ' best' : ''}${tried === 'same' || tried === 'worse' ? ' tried' : ''}">${name}
      <div class="why">${esc(t(c.why, dfVars(c.vars)))}${rows}${how}</div><div class="go">${btn}</div></div>`;
  };
  const first = causes.findIndex(c => c.kind !== 'need');
  $('df-plan').innerHTML = causes.map((c, i) => (i === first ? `<div class="sec">${esc(t('df_best'))}</div>` : i === first + 1 ? `<div class="sec">${esc(t('df_more'))}</div>` : '')
    + card(c, i, i === first)).join('');
}

$('df-inputs').addEventListener('click', e => {
  if (e.target.id === 'btn-df-row') { DF.rows.push({kind: 'outer', expected: '', measured: ''}); renderDefects(); }
  if (e.target.id === 'btn-df-calc') dfAsk();
});
const TEST_CALIB = {flow: 'flow_yolo', pa: 'pa', mvs: 'max_flow', temp: 'temp', retraction: 'retraction'};
function renderDefectHistory(m) {
  $('dfh-all').checked = !!m.all;
  const items = m.items || [];
  $('dfh-list').innerHTML = items.length ? items.map(a => {
    const ch = (a.changes || []).map(c => `${dfLabel(c.key)} ${dfValue(c.before)} → ${dfValue(c.after)}`).join(' · ');
    const into = a.filament || a.process || '';
    return `<div class="item"><div><b>${esc(t('dn_' + a.defect))}</b>: ${esc(t('cn_' + a.cause))}${m.all ? ` · ${esc(a.label || '')}` : ''}
        ${into ? `<span class="tag">${esc(into)}</span>` : ''}${ch ? `<div class="note">${esc(ch)}</div>` : ''}</div>
      <div style="text-align:right">${a.outcome ? `<span class="tag ${a.outcome === 'fixed' || a.outcome === 'better' ? 'good' : 'bad'}">${esc(t('po_' + a.outcome))}</span>` : `<span class="tag">${esc(t('dfh_pending'))}</span>`}
        <div class="when">${esc(fmtTime(a.at))}</div></div></div>`;
  }).join('') : `<div class="df-empty">${esc(t('dfh_none'))}</div>`;
}
$('btn-df-history').addEventListener('click', () => {
  const show = $('df-history').hidden;
  $('df-history').hidden = !show;
  for (const id of ['df-list', 'df-q', 'df-inputs', 'df-plan']) $(id).hidden = show;
  $('btn-df-history').textContent = t(show ? 'dfh_back' : 'dfh_open');
  if (show) send({cmd: 'defect_history', slot: DF.slot, all: $('dfh-all').checked});
});
$('dfh-all').addEventListener('change', () => send({cmd: 'defect_history', slot: DF.slot, all: $('dfh-all').checked}));
$('df-plan').addEventListener('click', e => {
  const cal = e.target.closest('[data-calib]');
  if (cal) {
    $('dlg-defects').close();
    renderCalib();
    $('c-test').value = TEST_CALIB[cal.dataset.calib];
    renderCalib();
    $('c-test').scrollIntoView({behavior: 'smooth', block: 'center'});
    return;
  }
  const a = e.target.closest('[data-apply]'), go = e.target.closest('[data-redirect]');
  if (go) { DF.defect = go.dataset.redirect; DF.answers = {}; renderDefects(); dfAsk(); return; }
  if (!a) return;
  const c = DF.causes[+a.dataset.apply];
  a.disabled = true;
  send({cmd: 'defect_apply', defect: DF.defect, cause: c.cause, answers: dfAnswers(), inputs: dfInputs(), slot: DF.slot});
});
$('df-pending').addEventListener('click', e => {
  const b = e.target.closest('[data-outcome]');
  if (!b) return;
  b.disabled = true;
  send({cmd: 'defect_outcome', id: b.dataset.id, outcome: b.dataset.outcome});
});
$('btn-review').addEventListener('click', () => { renderReview(); $('dlg-review').showModal(); send({cmd: 'review'}); });
$('btn-review-again').addEventListener('click', () => send({cmd: 'review'}));
$('issues').addEventListener('click', e => {
  const b = e.target.closest('[data-fix]');
  if (!b) return;
  const issue = (S.issues || [])[+b.dataset.issue];
  if (!issue) return;
  if (b.dataset.fix === 'research') { openForResearch(issue); return; }
  const sp = $('issues').querySelector(`[data-sp="${b.dataset.issue}"]`);
  b.disabled = true;
  send({cmd: 'review_fix', fix: b.dataset.fix, code: issue.code, preset: issue.preset,
        source: (issue.details || {}).source || issue.preset, spoolman: !!(sp && sp.checked)});
});
$('btn-history').addEventListener('click', () => { renderHistory(); $('dlg-history').showModal(); send({cmd: 'history'}); });
$('history-list').addEventListener('click', e => {
  const d = e.target.closest('[data-hdiff]'), r = e.target.closest('[data-hrestore]');
  if (d) send({cmd: 'history_diff', id: d.dataset.hdiff});
  if (r) { r.disabled = true; send({cmd: 'history_restore', id: r.dataset.hrestore}); }
});
$('btn-saved').addEventListener('click', () => { renderSaved(); $('dlg-saved').showModal(); send({cmd: 'saved'}); });
$('saved-list').addEventListener('click', e => { const n = e.target.dataset.remove; if (n) send({cmd: 'remove_preset', name: n}); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

// ---------- messages from the plugin
const STEP_ORDER = ['ofd', 'spoolmandb', 'orca', 'tds'];
function onMessage(m) {
  if (!m || !m.cmd) return;
  switch (m.cmd) {
    case 'init':
      S.settings = m.settings; S.printer = m.printer; S.processes = m.processes || []; S.saved = m.saved || []; S.habits = m.habits || null;
      DF.pending = m.pending || [];
      lang(); translate(); renderPrinter(); renderDefectPending();
      if (S.settings.spoolman_url) send({cmd: 'spoolman_list'}); else { setPick('manual'); renderSpools(); }
      send({cmd: 'orca_filaments'});
      send({cmd: 'preflight'});
      break;
    case 'orca_filaments':
      S.orca = m.items || [];
      if (S.orcaPreset) S.orcaPreset = S.orca.find(f => f.name === S.orcaPreset.name) || null;
      // no Spoolman: start from the presets the user already has
      if (!S.pickTouched && !S.settings.spoolman_url && S.orca.length) setPick('orca');
      renderOrca();
      break;
    case 'settings': {
      const before = {lang: L, url: S.settings.spoolman_url};
      S.settings = m.settings; lang(); translate(); renderPrinter(); renderSpools();
      const changed = before.lang !== L || before.url !== S.settings.spoolman_url;
      if (S.result && changed) renderResult();     // the material table or an enclosure: the open plan stays
      if (S.settings.spoolman_url && changed) send({cmd: 'spoolman_list'});
      break; }
    case 'products': {
      if (m.brand !== $('f-brand').value.trim()) break;
      const list = m.products || [];
      $('products').innerHTML = list.map(p => `<option value="${esc(p.name)}">${esc(p.material)}</option>`).join('');
      $('products-note').textContent = list.length ? t('products_found', {n: list.length}) : '';
      break; }
    case 'spoolman_list':
      S.spools = m.filaments || []; renderSpools();
      $('spool-note').textContent = '';
      break;
    case 'progress':
      if (m.step && STEP_ORDER.includes(m.step)) {
        for (const s of STEP_ORDER) { if (S.steps[s] === 'run') S.steps[s] = 'ok'; }
        S.steps[m.step] = 'run'; renderSources(null);
      }
      break;
    case 'result':
      busy($('btn-research'), false);
      S.result = m; S.printer = m.printer || S.printer;
      renderPrinter(); renderSources(m.reports); renderResult();
      break;
    case 'measured':
      toast(t('measured_saved'));
      renderMeasured(m.sections);
      research();
      break;
    case 'saved':
      busy($('btn-make-preset'), false); busy($('btn-process-save'), false);
      S.saved = m.saved || S.saved; renderSaved();
      if (m.renamed) $('preset-name').value = m.name;
      const cool = Object.entries(m.cooling || {}).map(([k, v]) => k + ' ' + v).join(', ');
      if (m.kind === 'filament') toast(t('made_preset', {name: m.name}) + (m.renamed ? ' ' + t('renamed') : '') + (cool ? ' ' + t('cool_done', {list: cool}) : ''));
      else if (m.kind === 'process') toast(t('made_process', {name: m.name}) + (m.renamed ? ' ' + t('renamed') : ''));
      if ((m.left_out || []).length || (m.set_aside || []).length) {
        const parts = [];
        if ((m.set_aside || []).length) parts.push(t('set_aside', {names: m.set_aside.map(x => '„' + x.name + '” (' + t('aside_' + x.how) + ')').join(', ')}));
        if ((m.left_out || []).length) parts.push(t('left_out', {keys: m.left_out.join(', ')}));
        toast(t(m.kind === 'process' ? 'made_process' : 'made_preset', {name: m.name}) + ' ' + parts.join(' '), true);
      }
      else if (m.kind === 'removed') toast(t('removed', {name: m.name}));
      else if (m.kind === 'restored') { toast(t('restored', {name: m.name})); send({cmd: 'history'}); }
      if (m.kind !== 'list') send({cmd: 'review', quiet: true});
      break;
    case 'spoolman_plan': {
      const box = $('spoolman-plan');
      const v = k => m.values[k], old = k => (m.existing || {})[k];
      const add = (m.added || []).map(k => `<li>${esc(label(k))} = <span class="mono">${esc(v(k))}</span></li>`).join('');
      const diff = (m.differs || []).map(k => `<li><label class="inline"><input type="checkbox" data-ow="${esc(k)}"> ${esc(label(k))}:
          <span class="mono muted">${esc(old(k))}</span> → <span class="mono">${esc(v(k))}</span></label></li>`).join('');
      const same = (m.same || []).map(k => `<li>${esc(label(k))} <span class="mono muted">${esc(old(k))}</span></li>`).join('');
      box.querySelector('.muted.small') && box.querySelector('.muted.small').remove();
      box.querySelectorAll('.planbody').forEach(el => el.remove());
      const div = document.createElement('div');
      div.className = 'planbody';
      div.innerHTML = `<div style="margin-top:8px">${esc(t('sp_plan', {id: m.id, section: m.section}))}</div>` +
        (m.added.length ? `<div style="margin-top:6px"><b>${esc(t('sp_add', {n: m.added.length}))}</b><ul>${add}</ul></div>` : '') +
        (m.differs.length ? `<div style="margin-top:6px"><b>${esc(t('sp_differs', {n: m.differs.length}))}</b>
            <label class="inline small" style="margin-left:8px"><input type="checkbox" id="sp-ow-all"> ${esc(t('sp_ow_all'))}</label><ul class="ow">${diff}</ul></div>` : '') +
        (m.same.length ? `<details style="margin-top:6px"><summary>${esc(t('sp_same', {n: m.same.length}))}</summary><ul>${same}</ul></details>` : '') +
        (!m.added.length && !m.differs.length ? `<div style="margin-top:6px">${esc(t('sp_nothing'))}</div>` : '') +
        (m.added.length || m.differs.length ? `<div class="actions" style="margin-top:8px"><button id="btn-sp-write">${esc(t('sp_confirm'))}</button></div>` : '');
      box.appendChild(div);
      const w = $('btn-sp-write');
      const chosen = () => Array.from(div.querySelectorAll('[data-ow]:checked')).map(el => el.dataset.ow);
      const sync = () => { if (w) w.disabled = !m.added.length && !chosen().length; };
      const all = $('sp-ow-all');
      if (all) all.addEventListener('change', () => { div.querySelectorAll('[data-ow]').forEach(el => el.checked = all.checked); sync(); });
      div.querySelectorAll('[data-ow]').forEach(el => el.addEventListener('change', sync));
      sync();
      if (w) w.addEventListener('click', () => { w.disabled = true; send({cmd: 'spoolman_write', spoolman_id: m.id, section: m.section, settings: chosenSettings(), overwrite: chosen()}); });
      break; }
    case 'spoolman_written':
      $('spoolman-plan').hidden = true;
      toast(t('sp_written', {n: (m.added || []).length + (m.replaced || []).length}));
      send({cmd: 'spoolman_list'});
      break;
    case 'process_plan':
      S.plan = m;
      $('p-plan').hidden = false;
      $('p-name').value = m.name.replace(' small parts ', ' ' + t('name_small') + ' ');
      $('p-variant').value = m.asked || m.variant;
      const groups = [['speed', t('g_speed')], ['accel', t('g_accel')]];
      $('p-rows').innerHTML = m.changes.length ? groups.map(([g, title]) => {
          const rows = m.changes.filter(c => c.group === g);
          if (!rows.length) return '';
          return `<tr><td colspan="4" class="small" style="font-weight:650;padding-top:10px">${esc(title)} (${rows.length})</td></tr>` +
            rows.map(c => `<tr><td>${esc(label(c.key))}</td><td class="mono">${esc(fmtNum(c.base))} ${esc(c.unit)}</td><td class="mono"><b style="color:var(--tested)">${esc(fmtNum(c.new))} ${esc(c.unit)}</b></td><td class="why">${esc((c.reasons || []).map(reasonText).join(' · '))}</td></tr>`).join('');
        }).join('') : `<tr><td colspan="4" class="muted">${esc(t('no_changes'))}</td></tr>`;
      $('p-variant-note').textContent = m.asked === 'plate'
        ? (m.sizes && m.sizes.length ? t('plate_sizes', {sizes: m.sizes.map(s => s[0] + '×' + s[1]).join(', '), v: t('v_' + m.variant)}) : t('plate_empty'))
        : '';
      $('btn-process-save').disabled = !m.changes.length;
      $('p-note').textContent = m.layer_height ? t('layer', {h: m.layer_height}) : '';
      renderWarnings();
      break;
    case 'preflight':
      PF.report = m.report;
      pfBadge();
      if ($('dlg-preflight').open) renderPreflight();
      break;
    case 'preflight_ready':
      send({cmd: 'preflight'});
      break;
    case 'preflight_applied':
      if (m.saved) S.saved = m.saved;
      toast(t('pf_applied', {names: [m.written && m.written.filament, m.written && m.written.process].filter(Boolean).join(', ')}));
      break;
    case 'defect_history':
      renderDefectHistory(m);
      break;
    case 'defect_context':
      DF.meta = {list: m.list, questions: m.questions, inputs: m.inputs};
    // falls through
    case 'defect_plan':
      if (m.cmd === 'defect_plan' && m.defect !== DF.defect && !m.applied && !m.outcome) break;
      if (m.outcome) DF.defect = m.defect;
      DF.info = m.info || DF.info; DF.causes = m.causes || []; DF.pending = m.pending || [];
      if (m.info) DF.slot = m.info.slot;
      if (m.saved) { S.saved = m.saved; renderSaved(); }
      renderDefects(); renderDefectPending();
      if (m.applied) {
        const made = (m.applied.created || [])[0];
        const into = m.applied.filament || m.applied.process;
        toast(made ? t('df_created', {name: made.name}) : into ? t('df_applied', {name: into}) : t('df_noted'));
      }
      if (m.outcome) toast(m.note ? t('dn_' + m.note) : t('dn_kept'));
      if (m.applied || m.outcome) send({cmd: 'review', quiet: true});
      break;
    case 'review': {
      const before = new Set((S.issues || []).filter(i => i.code === 'orca_changed').map(i => i.preset));
      S.issues = m.issues || [];
      if (m.saved) { S.saved = m.saved; renderSaved(); }
      renderReview();
      if (m.fixed) toast(t(m.note ? 'rv_' + m.note : 'rv_done'));
      const changed = S.issues.filter(i => i.code === 'orca_changed' && !before.has(i.preset));
      if (m.quiet && changed.length) toast(t('review_toast', {name: changed[0].label.replace(/^_local\/[^/]+\//, '')}));
      break; }
    case 'history':
      renderHistory(m.entries || []);
      break;
    case 'history_diff':
      renderHistoryDiff(m);
      break;
    case 'error': {
      busy($('btn-research'), false); busy($('btn-make-preset'), false); busy($('btn-process-save'), false);
      const msg = T[L][m.message] ? t(m.message) : m.message;
      if (m.where === 'spoolman_list') { $('spool-note').textContent = msg; renderSpools(); }
      else toast(t('err', {m: msg}), true);
      if (m.where === 'research') renderSources([]);
      if (m.where === 'review_fix') send({cmd: 'review'});
      if (m.where && m.where.startsWith('defect_')) { if (DF.defect) dfAsk(); else renderDefects(); }
      if (m.where === 'history_restore' || m.where === 'history_diff') send({cmd: 'history'});
      break; }
  }
}
if (window.orca && orca.onMessage) orca.onMessage(onMessage);
window.__filaforge = { onMessage, S };

// ---------- start
lang(); translate();
$('f-material').innerHTML = MATERIALS.map(m => `<option>${m}</option>`).join('');
$('brands').innerHTML = BRANDS.map(b => `<option value="${esc(b)}">`).join('');
renderSpools(); renderOrca(); renderSheets(); renderResult();
send({cmd: 'init'});
</script>
</body>
</html>
