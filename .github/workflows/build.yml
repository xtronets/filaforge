# Tests and filaforge_any.whl on every push; on a published release the wheel is attached to it.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the wheel to this existing release (e.g. v0.2.2); empty = build only"
        required: false

permissions:
  contents: write

jobs:
  tests:
    # the plugin runs inside OrcaSlicer on Windows, macOS and Linux: paths, files and text on each of them
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests

  build:
    needs: tests
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python scripts/build.py

      - name: Release tag matches VERSION
        if: env.TAG != ''
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'^VERSION = \"([^\"]+)\"', pathlib.Path('src/filaforge/plugin.py').read_text(), re.M).group(1))")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match VERSION $version in src/filaforge/plugin.py"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: filaforge_any.whl
          path: dist/filaforge_any.whl

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/filaforge_any.whl --clobber --repo "${{ github.repository }}"
