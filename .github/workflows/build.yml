# Tests and filaforge_any.whl on every push; on a published release the wheel is attached to it.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build the wheel
        run: python scripts/build.py

      - name: Release tag matches VERSION
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'^VERSION = \"([^\"]+)\"', pathlib.Path('src/filaforge/plugin.py').read_text(), re.M).group(1))")
          tag="${{ github.event.release.tag_name }}"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Release tag $tag does not match VERSION $version in src/filaforge/plugin.py"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: filaforge_any.whl
          path: dist/filaforge_any.whl

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/filaforge_any.whl --clobber --repo "${{ github.repository }}"
